<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 96" fill="none">
  <defs>
    <linearGradient id="tnGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8D6" />
      <stop offset="50%" stop-color="#E8C766" />
      <stop offset="100%" stop-color="#B8860B" />
    </linearGradient>
    <linearGradient id="tnRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4D4D" />
      <stop offset="100%" stop-color="#990000" />
    </linearGradient>
    <filter id="tnGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left Hexagonal Cyber Node Emblem -->
  <g transform="translate(16, 14)">
    <polygon points="34,0 64,16 64,52 34,68 4,52 4,16" fill="#0C0D14" stroke="url(#tnGold)" stroke-width="2" />
    <polygon points="34,11 53,22 53,46 34,57 15,46 15,22" fill="#121520" stroke="#FF4D4D" stroke-width="1.2" opacity="0.8" />
    <circle cx="34" cy="34" r="5.5" fill="#E8C766" filter="url(#tnGlow)" />
    <line x1="34" y1="12" x2="34" y2="28" stroke="#E8C766" stroke-width="2" />
    <line x1="34" y1="40" x2="34" y2="56" stroke="#FF4D4D" stroke-width="2" />
    <line x1="15" y1="34" x2="28" y2="34" stroke="#FFF8D6" stroke-width="2" />
    <line x1="40" y1="34" x2="53" y2="34" stroke="#FFF8D6" stroke-width="2" />
  </g>

  <!-- Typography -->
  <text x="100" y="46" font-family="'Orbitron', 'Inter', sans-serif" font-weight="900" font-size="25" letter-spacing="3.5" fill="#FFFFFF">
    TITAN
  </text>
  <text x="206" y="46" font-family="'Orbitron', sans-serif" font-weight="900" font-size="25" letter-spacing="3.5" fill="url(#tnGold)">
    NET
  </text>
  <text x="102" y="66" font-family="'Inter', sans-serif" font-weight="800" font-size="9.5" letter-spacing="5.5" fill="#CBD5E1">
    FIBER &amp; INFRASTRUCTURE
  </text>
  <!-- Accent Line -->
  <line x1="100" y1="74" x2="310" y2="74" stroke="#E8C766" stroke-opacity="0.35" stroke-width="1.5" />
  <circle cx="310" cy="74" r="2" fill="#FF4D4D" />
</svg>
