<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 96" fill="none">
  <defs>
    <linearGradient id="pmGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8D6" />
      <stop offset="50%" stop-color="#E8C766" />
      <stop offset="100%" stop-color="#B8860B" />
    </linearGradient>
    <linearGradient id="pmRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3B30" />
      <stop offset="100%" stop-color="#8B0000" />
    </linearGradient>
    <filter id="pmGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left Broadcast Shield Emblem -->
  <g transform="translate(16, 14)">
    <polygon points="34,0 68,16 68,52 34,68 0,52 0,16" fill="#0C0D14" stroke="url(#pmRed)" stroke-width="2" />
    <rect x="18" y="28" width="4.5" height="14" rx="2" fill="url(#pmGold)" />
    <rect x="26" y="20" width="4.5" height="30" rx="2" fill="#FFF8D6" />
    <rect x="34" y="13" width="4.5" height="44" rx="2" fill="url(#pmRed)" filter="url(#pmGlow)" />
    <rect x="42" y="20" width="4.5" height="30" rx="2" fill="#FFF8D6" />
    <rect x="50" y="28" width="4.5" height="14" rx="2" fill="url(#pmGold)" />
  </g>

  <!-- Typography -->
  <text x="100" y="46" font-family="'Orbitron', 'Inter', sans-serif" font-weight="900" font-size="25" letter-spacing="4" fill="url(#pmGold)">
    PULSE
  </text>
  <text x="216" y="46" font-family="'Orbitron', sans-serif" font-weight="900" font-size="25" letter-spacing="2.5" fill="#FFFFFF">
    MEDIA
  </text>
  <text x="102" y="66" font-family="'Inter', sans-serif" font-weight="800" font-size="9.5" letter-spacing="5.5" fill="#FF3B30">
    OFFICIAL BROADCAST
  </text>
  <!-- Accent Line -->
  <line x1="100" y1="74" x2="310" y2="74" stroke="#E8C766" stroke-opacity="0.35" stroke-width="1.5" />
  <circle cx="310" cy="74" r="2" fill="#E8C766" />
</svg>
